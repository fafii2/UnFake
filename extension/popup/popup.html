<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UnFake</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-row">
        <img src="../icons/icon48.png" alt="UnFake" class="popup-logo">
        <div>
          <h1 class="popup-title">UnFake</h1>
          <p class="popup-subtitle">Misinformation Verification</p>
        </div>
      </div>
    </header>

    <!-- Status indicator -->
    <div class="status-bar" id="statusBar">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">Checking backend...</span>
    </div>

    <!-- Image / Quote Card Crop Action -->
    <section class="popup-section">
      <h2 class="section-title">Image / Quote Card</h2>
      <button id="cropBtn" class="crop-button">
        <span class="crop-btn-icon">✂️</span> Crop & Verify Image Region
      </button>
    </section>

    <!-- Manual input -->
    <section class="popup-section">
      <h2 class="section-title">Text verification</h2>
      <textarea
        id="manualClaim"
        class="manual-input"
        placeholder="Paste a claim or statement to verify..."
        rows="3"
        maxlength="5000"
      ></textarea>
      <button id="verifyBtn" class="verify-button" disabled>
        Verify Text Claim
      </button>
    </section>

    <!-- Instructions -->
    <section class="popup-section">
      <h2 class="section-title">Right-Click Shortcuts</h2>
      <ol class="instructions-list">
        <li><strong>Selected text</strong>: Right-click → "Verify Text with UnFake"</li>
        <li><strong>Quote cards / Infographics</strong>: Right-click → "Verify Image / Screen Region"</li>
      </ol>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>v0.3.0 — Milestone 3 (Text & Image OCR)</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
